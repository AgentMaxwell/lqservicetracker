<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gear Service Tracker</title>
    <style>
        /* Tablet-Optimized CSS */
        :root {
            --primary: #005A9C;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1, h2 { text-align: center; color: var(--primary); margin-top: 0;}
        
        /* Form Elements */
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 1.2rem;}
        select, input, button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .btn-primary { background-color: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer;}
        .btn-primary:active { background-color: #004080; }
        .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); font-weight: bold; cursor: pointer;}
        
        /* Admin / Site Management */
        #adminSection { background: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; }
        
        /* Navigation Controls */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .nav-controls button { width: auto; margin: 0; padding: 15px 30px; }
        .nav-status { text-align: center; font-size: 1.4rem; font-weight: bold; }
        .save-indicator { font-size: 0.9rem; color: var(--secondary); display: block; margin-top: 5px; font-weight: normal;}
        
        /* Gear Parts Checklist */
        .part-section {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .part-header { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        .button-group { display: flex; gap: 10px; }
        .btn-good, .btn-issue {
            flex: 1; padding: 15px; color: white; border: none; cursor: pointer; font-weight: bold; transition: opacity 0.2s; border-radius: 8px;
        }
        .btn-good { background-color: var(--secondary); }
        .btn-good.active { background-color: var(--success); }
        .btn-issue { background-color: var(--secondary); }
        .btn-issue.active { background-color: var(--danger); }
        
        /* Notes Area */
        .notes-area { display: none; margin-top: 15px; }
        .notes-area.visible { display: block; }
        textarea {
            width: 100%; height: 100px; padding: 12px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #ccc; resize: vertical; box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gear Service Tracker</h1>

    <div id="setupSection">
        <label for="siteSelect">Select Site:</label>
        <select id="siteSelect">
            <option value="">Loading sites...</option>
        </select>
        
        <button class="btn-outline" id="toggleAdminBtn">+ Manage Sites</button>
    </div>

    <div id="adminSection">
        <h2>Add New Site</h2>
        <label>Site Name:</label>
        <input type="text" id="newSiteName" placeholder="e.g. Site Delta">
        <label>Number of Gears:</label>
        <input type="number" id="newSiteCount" placeholder="e.g. 12">
        <button class="btn-primary" id="saveSiteBtn">Save Site to Cloud</button>
    </div>

    <div id="serviceSection" style="display: none;">
        
        <div class="nav-controls">
            <button class="btn-primary" id="prevBtn" disabled>&laquo; Back</button>
            <div class="nav-status">
                <div id="gearCounter">Gear 1 of X</div>
                <div class="save-indicator" id="saveIndicator">Cloud Synced ✓</div>
            </div>
            <button class="btn-primary" id="nextBtn">Next &raquo;</button>
        </div>

        <div id="partsContainer"></div>

    </div>
</div>

<script type="module">
    // 1. Import your database connection from your new file
    import { db } from './firebase-config.js';
    
    // 2. Import ONLY the Firestore functions you need (no initializeApp needed here anymore)
    import { collection, addDoc, setDoc, getDocs, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- App State ---
    let sitesData = {}; 
    let currentSiteName = "";
    let totalGears = 0;
    let currentGearIndex = 1;
    let gearDataCache = {}; // Stores session data locally before/after sync
    let isDirty = false;    // Tracks if changes were made that need saving
    const partsList = ["Right Shoulder", "Left Shoulder", "Front", "Back", "Gun"];

    // DOM Elements
    const siteSelect = document.getElementById('siteSelect');
    const toggleAdminBtn = document.getElementById('toggleAdminBtn');
    const adminSection = document.getElementById('adminSection');
    const saveSiteBtn = document.getElementById('saveSiteBtn');
    const setupSection = document.getElementById('setupSection');
    const serviceSection = document.getElementById('serviceSection');
    
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const gearCounter = document.getElementById('gearCounter');
    const saveIndicator = document.getElementById('saveIndicator');
    const partsContainer = document.getElementById('partsContainer');

    // --- 1. INITIALIZATION & SITES MANAGEMENT ---

    async function loadSites() {
        siteSelect.innerHTML = '<option value="">-- Choose Site --</option>';
        try {
            const querySnapshot = await getDocs(collection(db, "sites"));
            sitesData = {};
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                sitesData[data.name] = data.gearCount;
                siteSelect.innerHTML += `<option value="${data.name}">${data.name} (${data.gearCount} Gears)</option>`;
            });
        } catch (error) {
            console.error("Error loading sites: ", error);
            siteSelect.innerHTML = '<option value="">Error loading sites. Check console.</option>';
        }
    }

    toggleAdminBtn.addEventListener('click', () => {
        adminSection.style.display = adminSection.style.display === 'none' || adminSection.style.display === '' ? 'block' : 'none';
    });

    saveSiteBtn.addEventListener('click', async () => {
        const name = document.getElementById('newSiteName').value.trim();
        const count = parseInt(document.getElementById('newSiteCount').value);
        if (!name || isNaN(count) || count <= 0) return alert("Please enter a valid name and gear count.");
        
        saveSiteBtn.innerText = "Saving...";
        try {
            await addDoc(collection(db, "sites"), { name: name, gearCount: count });
            document.getElementById('newSiteName').value = "";
            document.getElementById('newSiteCount').value = "";
            adminSection.style.display = 'none';
            saveSiteBtn.innerText = "Save Site to Cloud";
            await loadSites(); // Refresh dropdown
        } catch (error) {
            console.error("Error saving site:", error);
            alert("Failed to save site.");
        }
    });

    // --- 2. STARTING A SERVICE SESSION ---

    siteSelect.addEventListener('change', (e) => {
        currentSiteName = e.target.value;
        if (currentSiteName) {
            totalGears = sitesData[currentSiteName];
            currentGearIndex = 1;
            gearDataCache = {}; // Reset session memory
            setupSection.style.display = 'none';
            serviceSection.style.display = 'block';
            renderGearUI();
        }
    });

    // --- 3. NAVIGATION & AUTO-SAVE LOGIC ---

    async function triggerBackgroundSave() {
        if (!isDirty) return; // Nothing changed, no need to save
        
        const gearToSave = currentGearIndex; 
        const dataToSave = gearDataCache[gearToSave];
        isDirty = false; // Reset dirty flag immediately for fast UI
        saveIndicator.innerText = "Saving to Cloud...";
        saveIndicator.style.color = "#ffc107"; // Yellow warning color while saving

        try {
            // Document ID format: SiteName-YYYY-MM-DD-Gear-X
            // This ensures if you navigate back to a gear on the same day, it overwrites the entry rather than making duplicates.
            const today = new Date().toISOString().split('T')[0];
            const safeSiteName = currentSiteName.replace(/\s+/g, '-');
            const docId = `${safeSiteName}-${today}-Gear-${gearToSave}`;

            await setDoc(doc(db, "services", docId), {
                site: currentSiteName,
                gearId: `Gear ${gearToSave}`,
                serviceDetails: dataToSave,
                lastUpdated: serverTimestamp()
            });

            saveIndicator.innerText = "Cloud Synced ✓";
            saveIndicator.style.color = "var(--success)";
        } catch (error) {
            console.error("Auto-save failed: ", error);
            saveIndicator.innerText = "Sync Failed ✗";
            saveIndicator.style.color = "var(--danger)";
            isDirty = true; // Flag as dirty so it tries again later
        }
    }

    prevBtn.addEventListener('click', async () => {
        await triggerBackgroundSave();
        if (currentGearIndex > 1) {
            currentGearIndex--;
            renderGearUI();
        }
    });

    nextBtn.addEventListener('click', async () => {
        await triggerBackgroundSave();
        if (currentGearIndex < totalGears) {
            currentGearIndex++;
            renderGearUI();
        } else {
            alert("You have reached the end of the gears for this site.");
            // Optional: Redirect back to site selection here
            // setupSection.style.display = 'block';
            // serviceSection.style.display = 'none';
            // siteSelect.value = "";
        }
    });

    // --- 4. RENDER GEAR UI ---

    function renderGearUI() {
        gearCounter.innerText = `Gear ${currentGearIndex} of ${totalGears}`;
        prevBtn.disabled = currentGearIndex === 1;
        nextBtn.innerText = currentGearIndex === totalGears ? "Finish" : "Next \u00BB";
        saveIndicator.innerText = "Cloud Synced ✓";
        saveIndicator.style.color = "var(--secondary)";

        // Initialize cache for this gear if it doesn't exist
        if (!gearDataCache[currentGearIndex]) {
            gearDataCache[currentGearIndex] = {};
            partsList.forEach(part => {
                gearDataCache[currentGearIndex][part] = { status: null, notes: "" };
            });
        }

        const currentData = gearDataCache[currentGearIndex];
        partsContainer.innerHTML = '';

        partsList.forEach(part => {
            const partId = part.replace(/\s+/g, '-').toLowerCase();
            const partData = currentData[part];
            
            const partDiv = document.createElement('div');
            partDiv.className = 'part-section';
            partDiv.innerHTML = `
                <div class="part-header">${part}</div>
                <div class="button-group">
                    <button class="btn-good ${partData.status === 'Good' ? 'active' : ''}" data-part="${part}">All Good</button>
                    <button class="btn-issue ${partData.status === 'Issue' ? 'active' : ''}" data-part="${part}">Needs Fix</button>
                </div>
                <div class="notes-area ${partData.status === 'Issue' ? 'visible' : ''}" id="notes-${partId}">
                    <label>What is wrong & what was fixed?</label>
                    <textarea data-part="${part}" placeholder="Enter details here...">${partData.notes}</textarea>
                </div>
            `;
            partsContainer.appendChild(partDiv);
        });

        attachInteractionListeners();
    }

    function attachInteractionListeners() {
        const buttons = partsContainer.querySelectorAll('button');
        const textareas = partsContainer.querySelectorAll('textarea');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                isDirty = true;
                saveIndicator.innerText = "Unsaved Changes...";
                saveIndicator.style.color = "var(--secondary)";

                const part = e.target.getAttribute('data-part');
                const isGoodBtn = e.target.classList.contains('btn-good');
                const partId = part.replace(/\s+/g, '-').toLowerCase();
                const notesArea = document.getElementById(`notes-${partId}`);
                const siblings = e.target.parentElement.querySelectorAll('button');

                // UI Update
                siblings.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                // State Update
                if (isGoodBtn) {
                    notesArea.classList.remove('visible');
                    gearDataCache[currentGearIndex][part].status = "Good";
                    gearDataCache[currentGearIndex][part].notes = "";
                    notesArea.querySelector('textarea').value = "";
                } else {
                    notesArea.classList.add('visible');
                    gearDataCache[currentGearIndex][part].status = "Issue";
                }
            });
        });

        textareas.forEach(ta => {
            ta.addEventListener('input', (e) => {
                isDirty = true;
                saveIndicator.innerText = "Unsaved Changes...";
                saveIndicator.style.color = "var(--secondary)";
                
                const part = e.target.getAttribute('data-part');
                gearDataCache[currentGearIndex][part].notes = e.target.value;
            });
        });
    }

    // Initialize App
    loadSites();

</script>

</body>
</html>
