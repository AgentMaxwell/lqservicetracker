<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pack Service Tracker</title>
    <style>
        /* Tablet-Optimized DARK MODE CSS */
        :root {
            --primary: #E53935; /* Strong Red Accent */
            --secondary: #555555; /* Dark Grey */
            --success: #4CAF50; /* Readable Green */
            --danger: #E53935; /* Matching Red for issues */
            --bg-color: #121212; /* Deep Black Background */
            --card-bg: #1E1E1E; /* Elevated Dark Grey for Cards */
            --input-bg: #2C2C2C; /* Lighter Grey for Inputs */
            --text-main: #E0E0E0; /* Off-White Text for readability */
            --border-color: #333333; /* Subtle borders */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }
        
        .container {
            max-width: 1100px;
            margin: 15px auto;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
        }
        
        /* App Header with Home Button */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }
        .app-header h1 { margin: 0; text-align: center; flex: 1; color: var(--primary); font-size: 1.8rem; letter-spacing: 1px;}
        .home-btn {
            background-color: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer;
            padding: 10px 18px; font-size: 1rem; border-radius: 8px; width: auto; margin: 0;
        }
        .home-btn:active { background-color: #b71c1c; }
        .header-spacer { width: 90px; } 

        h2, h3 { text-align: center; color: var(--primary); margin-top: 0; margin-bottom: 15px;}
        
        /* Form Elements */
        label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 1.1rem; color: #bbb;}
        select, input, button:not(.home-btn):not(.admin-btn):not(.close-btn) {
            width: 100%; padding: 12px; font-size: 1.1rem; border-radius: 8px; border: 1px solid var(--border-color); 
            margin-bottom: 15px; box-sizing: border-box; background-color: var(--input-bg); color: var(--text-main);
            color-scheme: dark; 
        }
        select:focus, input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
        
        /* Button Styles */
        .btn-primary { background-color: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-primary:active { background-color: #b71c1c; }
        .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); font-weight: bold; cursor: pointer; }
        .btn-outline:active { background-color: rgba(229, 57, 53, 0.1); }
        .btn-secondary { background-color: var(--secondary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-secondary:active { background-color: #444; }
        .btn-danger { background-color: var(--danger); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-success { background-color: var(--success); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-success:active { opacity: 0.8; }
        
        /* Sections */
        .app-section { display: none; }
        .app-section.active { display: block; }
        .action-group { display: flex; gap: 10px; }
        
        /* Admin Management List */
        .site-manager-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 10px;
        }
        .site-manager-item strong { font-size: 1.1rem; color: #fff;}
        .admin-controls { display: flex; gap: 8px; }
        .admin-btn { padding: 8px 12px; font-size: 0.95rem; border-radius: 6px; cursor: pointer; border: none; color: white;}
        .btn-edit { background-color: #f57c00; color: white; font-weight: bold;}
        .btn-del { background-color: var(--danger); font-weight: bold;}

        /* --- ACTIVE SERVICE LAYOUT --- */
        .service-layout { display: flex; gap: 15px; align-items: flex-start; }
        .service-main { flex: 2.5; min-width: 0; } 
        .service-sidebar { 
            flex: 1; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); min-width: 0; position: sticky; top: 15px;
        }
        
        /* Sidebar Elements */
        .sidebar-title { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 12px; text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        .service-sidebar textarea { width: 100%; height: 140px; padding: 10px; font-size: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); resize: vertical; margin-bottom: 10px; box-sizing: border-box; }
        .service-sidebar button { padding: 10px; font-size: 1.05rem; margin-bottom: 8px; }

        /* Navigation Controls */
        .nav-controls { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; gap: 15px; border: 1px solid var(--border-color); }
        .nav-controls button { flex: 1; max-width: 120px; margin: 0; padding: 10px; font-size: 1.05rem; }
        .nav-status { flex: 2; display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 1.2rem; font-weight: bold; color: #fff;}
        .save-indicator { font-size: 0.85rem; color: #aaa; display: block; margin-top: 2px; font-weight: normal;}
        
        /* Pack Parts Checklist Grid */
        #packAllOkBtn { padding: 12px; margin-bottom: 15px; font-size: 1.1rem; }
        #partsContainer { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

        .part-section { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 0; background: var(--input-bg); }
        .part-header { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; text-align: center; color: #fff;}
        .button-group { display: flex; gap: 8px; }
        .btn-good, .btn-issue { flex: 1; padding: 10px; color: white; border: none; cursor: pointer; font-weight: bold; transition: opacity 0.2s; border-radius: 6px; font-size: 1rem; }
        .btn-good { background-color: var(--secondary); }
        .btn-issue { background-color: var(--secondary); }
        
        /* GUARANTEED ACTIVE COLORS */
        .btn-good.active { background-color: var(--success) !important; color: white !important; box-shadow: inset 0 0 8px rgba(0,0,0,0.4);}
        .btn-issue.active { background-color: var(--danger) !important; color: white !important; box-shadow: inset 0 0 8px rgba(0,0,0,0.4);}
        
        .notes-area { display: none; margin-top: 10px; }
        .notes-area.visible { display: block; }
        .notes-area textarea { width: 100%; height: 75px; padding: 8px; font-size: 1rem; border-radius: 6px; border: 1px solid var(--border-color); background: #1e1e1e; color: var(--text-main); resize: vertical; box-sizing: border-box; }

        /* Report Table Styles (Dark Mode) */
        .table-responsive { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 12px 10px; text-align: center; }
        th { background-color: var(--primary); color: white; font-size: 1.05rem; }
        tr:nth-child(even) { background-color: #262626; }
        tr:nth-child(odd) { background-color: var(--input-bg); }
        .tick { color: var(--success); font-size: 1.4rem; font-weight: bold;}
        .cross { color: var(--danger); font-size: 1.4rem; font-weight: bold;}
        .pending { color: #888; font-style: italic; font-size: 0.95rem; }
        .notes-cell { text-align: left; font-size: 0.9rem; color: #ff8a80; max-width: 250px; }

        /* Modal / Overlay Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        .modal-content { background-color: var(--card-bg); margin: 3% auto; padding: 25px; border-radius: 12px; width: 95%; max-width: 1000px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); position: relative; border: 1px solid var(--border-color); }
        .close-btn { position: absolute; top: 15px; right: 20px; color: #888; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; }
        .close-btn:hover, .close-btn:focus { color: #fff; text-decoration: none; cursor: pointer; }

        /* --- INK-SAVING PRINT STYLES --- */
        #printOnlyArea { display: none; }
        @media print {
            body { background-color: white !important; color: black !important; }
            body * { visibility: hidden; }
            #printOnlyArea, #printOnlyArea * { visibility: visible; }
            #printOnlyArea { display: block; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; color: black; font-family: sans-serif; background: white; }
            .print-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
            .print-pack-block { border-bottom: 1px solid #ccc; padding-bottom: 15px; margin-bottom: 15px; }
            .print-pack-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: black; }
            .print-issue-list { margin: 0; padding-left: 20px; color: black; }
            .print-issue-list li { margin-bottom: 5px; }
            h1, h2 { color: black !important; }
        }
        
        /* Mobile adjustment for sidebar */
        @media (max-width: 768px) {
            .service-layout { flex-direction: column; }
            .service-sidebar { width: 100%; position: static; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="app-header">
        <button id="navHomeBtn" class="home-btn">🏠 Home</button>
        <h1>Pack Service Tracker</h1>
        <div class="header-spacer"></div> </div>

    <div id="setupSection" class="app-section active">
        <label for="siteSelect">Select Site to Start Service:</label>
        <select id="siteSelect">
            <option value="">Loading sites...</option>
        </select>
        
        <div id="serviceTypeSelection" style="display: none; background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color);">
            <p style="text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 0; color: #fff;">Site Selected. Prepare for Service:</p>
            
            <label style="margin-top: 10px;">Representative Name:</label>
            <input type="text" id="RepresentativeNameInput" placeholder="Enter your name" style="margin-bottom: 20px;">

            <div class="action-group" id="initialLoadGroup">
                <button class="btn-primary" id="startNewServiceBtn">Start New Service</button>
                <button class="btn-secondary" id="fetchDatesBtn">Load Previous Service</button>
            </div>
            
            <div id="dateSelectionUI" style="display: none; margin-top: 15px;">
                <label>Select Historical Service Date:</label>
                <select id="serviceDateSelect">
                    <option value="">-- Choose Date --</option>
                </select>
                <div class="action-group">
                    <button class="btn-primary" id="confirmLoadBtn">Load Selected Date</button>
                    <button class="btn-outline" id="cancelLoadBtn">Cancel</button>
                </div>
            </div>

            <div id="loadStatusMsg" style="text-align: center; font-weight: bold; margin-top: 10px;"></div>
        </div>

        <button class="btn-outline" id="toggleAdminBtn">⚙️ Manage Sites Database</button>
    </div>

    <div id="adminSection" class="app-section">
        <h2>Manage Sites Database</h2>
        
        <div id="adminSiteList" style="margin-bottom: 30px;">
            <p>Loading sites...</p>
        </div>

        <hr style="border: 1px solid var(--border-color); margin-bottom: 20px;">
        
        <h3>Add New Site</h3>
        <label>Site Name:</label>
        <input type="text" id="newSiteName" placeholder="e.g. Site Delta">
        <label>Number of Packs:</label>
        <input type="number" id="newSiteCount" placeholder="e.g. 12">
        <button class="btn-primary" id="saveSiteBtn">Save New Site</button>
    </div>

    <div id="serviceSection" class="app-section">
        <div class="service-layout">
            
            <div class="service-main">
                <div class="nav-controls">
                    <button class="btn-primary" id="prevBtn" disabled>&laquo; Back</button>
                    <div class="nav-status">
                        <div id="packCounter">Pack 1 of X</div>
                        <div class="save-indicator" id="saveIndicator">Cloud Synced ✓</div>
                    </div>
                    <button class="btn-primary" id="nextBtn">Next &raquo;</button>
                </div>

                <button class="btn-success" id="packAllOkBtn">✔ Mark Remaining Parts as "All Good"</button>

                <div id="partsContainer"></div>
            </div>

            <div class="service-sidebar">
                <div class="sidebar-title">Service Controls</div>
                
                <button class="btn-outline" id="viewOverlayGridBtn">📊 View Grid Overlay</button>
                <button class="btn-outline" id="sidebarPrintBtn">🖨️ Print Active Report</button>
                
                <label style="margin-top: 15px; font-size: 1.1rem;">General Site Notes</label>
                <textarea id="sidebarSiteNotes" placeholder="Enter broad facility issues, missing packs, etc..."></textarea>
                <button class="btn-primary" id="saveSidebarNotesBtn" style="padding: 10px; font-size: 1rem;">Save Notes</button>
                <div id="sidebarNotesMsg" style="text-align: center; font-weight: bold; font-size: 0.9rem;"></div>
            </div>

        </div>
    </div>
</div>

<div id="gridOverlayModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <h2 style="margin-top: 0;">Live Service Grid</h2>
        <div id="modalTableContainer" class="table-responsive">
            <p style="text-align: center;">Loading data...</p>
        </div>
    </div>
</div>

<div id="printOnlyArea"></div>

<script type="module">
    import { db } from './firebase-config.js';
    import { collection, addDoc, setDoc, getDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // App State
    let sitesData = {}; 
    let currentSiteName = "";
    let currentRepresentative = ""; 
    let activeServiceDate = ""; 
    let totalpacks = 0;
    let currentpackIndex = 1;
    let packDataCache = {}; 
    let fetchedServiceDocs = []; 
    let isDirty = false;    
    const partsList = ["Right Shoulder", "Left Shoulder", "Front", "Back", "Gun"];

    // DOM Elements
    const sections = document.querySelectorAll('.app-section');
    const serviceTypeSelection = document.getElementById('serviceTypeSelection');
    const gridModal = document.getElementById('gridOverlayModal');
    
    // --- 0. MENU NAVIGATION LOGIC ---
    async function navigateTo(sectionId) {
        if (document.getElementById('serviceSection').classList.contains('active')) {
            await triggerBackgroundSave();
        }

        sections.forEach(sec => sec.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        
        // Reset Setup UI
        document.getElementById('siteSelect').value = "";
        serviceTypeSelection.style.display = 'none';
        document.getElementById('initialLoadGroup').style.display = 'flex';
        document.getElementById('dateSelectionUI').style.display = 'none';
        
        if(sectionId === 'adminSection') renderAdminList();
    }

    document.getElementById('navHomeBtn').addEventListener('click', () => navigateTo('setupSection'));
    document.getElementById('toggleAdminBtn').addEventListener('click', () => navigateTo('adminSection'));

    // --- 1. INITIALIZATION & SITES MANAGEMENT ---
    async function loadSites() {
        const select = document.getElementById('siteSelect');
        select.innerHTML = '<option value="">-- Choose Site --</option>';
        
        try {
            const querySnapshot = await getDocs(collection(db, "sites"));
            sitesData = {};
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const count = data.packCount || data.gearCount || 0; 
                
                sitesData[data.name] = { id: doc.id, count: count };
                select.innerHTML += `<option value="${data.name}">${data.name} (${count} Packs)</option>`;
            });
        } catch (error) {
            console.error("Error loading sites: ", error);
        }
    }

    // --- 2. ADMIN CRUD LOGIC ---
    function renderAdminList() {
        const listDiv = document.getElementById('adminSiteList');
        listDiv.innerHTML = '';
        if (Object.keys(sitesData).length === 0) { listDiv.innerHTML = '<p>No sites found. Add one below!</p>'; return; }

        Object.keys(sitesData).forEach(siteName => {
            const siteInfo = sitesData[siteName];
            const itemDiv = document.createElement('div');
            itemDiv.className = 'site-manager-item';
            itemDiv.innerHTML = `
                <div><strong>${siteName}</strong><br><span style="color: #aaa;">${siteInfo.count} Packs</span></div>
                <div class="admin-controls">
                    <button class="admin-btn btn-edit" data-id="${siteInfo.id}" data-name="${siteName}" data-count="${siteInfo.count}">Edit</button>
                    <button class="admin-btn btn-del" data-id="${siteInfo.id}" data-name="${siteName}">Delete</button>
                </div>
            `;
            listDiv.appendChild(itemDiv);
        });

        document.querySelectorAll('.btn-edit').forEach(btn => btn.addEventListener('click', handleEditSite));
        document.querySelectorAll('.btn-del').forEach(btn => btn.addEventListener('click', handleDeleteSite));
    }

    async function handleEditSite(e) {
        const docId = e.target.getAttribute('data-id');
        const oldName = e.target.getAttribute('data-name');
        const oldCount = e.target.getAttribute('data-count');
        const newName = prompt("Edit Site Name:", oldName);
        if (newName === null) return; 
        const newCountStr = prompt("Edit Pack Count:", oldCount);
        if (newCountStr === null) return; 
        const newCount = parseInt(newCountStr);
        if (!newName.trim() || isNaN(newCount) || newCount <= 0) return alert("Invalid data.");
        
        try {
            e.target.innerText = "...";
            await updateDoc(doc(db, "sites", docId), { name: newName.trim(), packCount: newCount });
            await loadSites();
            renderAdminList();
        } catch (error) { alert("Error updating site."); }
    }

    async function handleDeleteSite(e) {
        const docId = e.target.getAttribute('data-id');
        const siteName = e.target.getAttribute('data-name');
        if(confirm(`Are you sure you want to permanently delete "${siteName}"?`)) {
            try {
                e.target.innerText = "...";
                await deleteDoc(doc(db, "sites", docId));
                await loadSites();
                renderAdminList();
            } catch (error) { alert("Error deleting site."); }
        }
    }

    document.getElementById('saveSiteBtn').addEventListener('click', async () => {
        const name = document.getElementById('newSiteName').value.trim();
        const count = parseInt(document.getElementById('newSiteCount').value);
        if (!name || isNaN(count) || count <= 0) return alert("Valid name/count required.");
        const btn = document.getElementById('saveSiteBtn');
        btn.innerText = "Saving...";
        try {
            await addDoc(collection(db, "sites"), { name: name, packCount: count });
            document.getElementById('newSiteName').value = "";
            document.getElementById('newSiteCount').value = "";
            btn.innerText = "Save New Site";
            await loadSites(); 
            renderAdminList(); 
        } catch (error) { alert("Failed to save site."); }
    });

    // --- 3. START / LOAD SERVICE FLOW ---
    document.getElementById('siteSelect').addEventListener('change', (e) => {
        currentSiteName = e.target.value;
        if (currentSiteName) {
            totalpacks = sitesData[currentSiteName].count;
            serviceTypeSelection.style.display = 'block';
            document.getElementById('initialLoadGroup').style.display = 'flex';
            document.getElementById('dateSelectionUI').style.display = 'none';
            document.getElementById('loadStatusMsg').innerText = '';
        } else {
            serviceTypeSelection.style.display = 'none';
        }
    });

    document.getElementById('startNewServiceBtn').addEventListener('click', async () => {
        const RepresentativeInput = document.getElementById('RepresentativeNameInput').value.trim();
        if(!RepresentativeInput) return alert("Please enter the Representative Name before starting.");
        
        currentRepresentative = RepresentativeInput;
        currentpackIndex = 1;
        packDataCache = {}; 
        activeServiceDate = new Date().toISOString().split('T')[0]; 
        
        await loadSidebarNotes(); 
        navigateTo('serviceSection');
        renderpackUI();
    });

    document.getElementById('fetchDatesBtn').addEventListener('click', async () => {
        const RepresentativeInput = document.getElementById('RepresentativeNameInput').value.trim();
        if(!RepresentativeInput) return alert("Please enter the Representative Name before loading.");
        
        currentRepresentative = RepresentativeInput;
        const msg = document.getElementById('loadStatusMsg');
        msg.innerText = "Finding historical dates...";
        msg.style.color = "var(--primary)";
        document.getElementById('initialLoadGroup').style.display = 'none';

        try {
            const q = query(collection(db, "services"), where("site", "==", currentSiteName));
            const querySnapshot = await getDocs(q);
            
            fetchedServiceDocs = [];
            const uniqueDates = new Set();
            
            querySnapshot.forEach(doc => {
                const data = doc.data();
                fetchedServiceDocs.push({ id: doc.id, ...data });
                const match = doc.id.match(/\d{4}-\d{2}-\d{2}/);
                if (match) uniqueDates.add(match[0]);
            });

            if (uniqueDates.size === 0) {
                msg.innerText = "No previous services found.";
                msg.style.color = "var(--danger)";
                document.getElementById('initialLoadGroup').style.display = 'flex';
                return;
            }

            const select = document.getElementById('serviceDateSelect');
            select.innerHTML = '<option value="">-- Choose Date --</option>';
            Array.from(uniqueDates).sort().reverse().forEach(date => select.innerHTML += `<option value="${date}">${date}</option>`);
            msg.innerText = "";
            document.getElementById('dateSelectionUI').style.display = 'block';

        } catch (error) {
            msg.innerText = "Error loading dates.";
            document.getElementById('initialLoadGroup').style.display = 'flex';
        }
    });

    document.getElementById('cancelLoadBtn').addEventListener('click', () => {
        document.getElementById('dateSelectionUI').style.display = 'none';
        document.getElementById('initialLoadGroup').style.display = 'flex';
        document.getElementById('loadStatusMsg').innerText = "";
    });

    document.getElementById('confirmLoadBtn').addEventListener('click', async () => {
        const selectedDate = document.getElementById('serviceDateSelect').value;
        if (!selectedDate) return alert("Select a date.");

        activeServiceDate = selectedDate; 

        const serviceMap = {};
        fetchedServiceDocs.forEach(record => {
            if (record.id.includes(selectedDate)) {
                if (!serviceMap[record.packId] || (record.lastUpdated > serviceMap[record.packId].lastUpdated)) {
                    serviceMap[record.packId] = record;
                }
            }
        });

        packDataCache = {};
        for (let i = 1; i <= totalpacks; i++) {
            const record = serviceMap[`pack ${i}`];
            if (record && record.serviceDetails) packDataCache[i] = record.serviceDetails;
        }

        currentpackIndex = 1;
        document.getElementById('loadStatusMsg').innerText = "";
        
        await loadSidebarNotes(); 
        navigateTo('serviceSection');
        renderpackUI();
    });

    // --- 4. DATE-SPECIFIC SITE NOTES LOGIC ---
    async function loadSidebarNotes() {
        const textArea = document.getElementById('sidebarSiteNotes');
        textArea.value = "Loading notes...";
        textArea.disabled = true;

        try {
            const docId = `${currentSiteName.replace(/\s+/g, '-')}-${activeServiceDate}`;
            const docRef = doc(db, "site_notes", docId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) textArea.value = docSnap.data().notes || "";
            else textArea.value = "";
        } catch (error) {
            textArea.value = "";
        }
        textArea.disabled = false;
    }

    document.getElementById('saveSidebarNotesBtn').addEventListener('click', async () => {
        const notes = document.getElementById('sidebarSiteNotes').value;
        const msg = document.getElementById('sidebarNotesMsg');
        const btn = document.getElementById('saveSidebarNotesBtn');

        btn.innerText = "Saving...";
        try {
            const docId = `${currentSiteName.replace(/\s+/g, '-')}-${activeServiceDate}`;
            const docRef = doc(db, "site_notes", docId);
            await setDoc(docRef, { notes: notes, lastUpdated: serverTimestamp() }, { merge: true });
            msg.innerText = "Saved ✓";
            msg.style.color = "var(--success)";
        } catch (error) {
            msg.innerText = "Error";
            msg.style.color = "var(--danger)";
        }
        btn.innerText = "Save Notes";
        setTimeout(() => msg.innerText = "", 3000);
    });

    // --- 5. SIDEBAR PRINT REPORT LOGIC ---
    document.getElementById('sidebarPrintBtn').addEventListener('click', async () => {
        await triggerBackgroundSave();

        const printArea = document.getElementById('printOnlyArea');
        const generalNotes = document.getElementById('sidebarSiteNotes').value || "None recorded.";
        
        // Calculate Next Service Due (9 months from activeServiceDate)
        let nextDueDateStr = "N/A";
        if (activeServiceDate) {
            const dateParts = activeServiceDate.split('-');
            if (dateParts.length === 3) {
                const year = parseInt(dateParts[0], 10);
                const month = parseInt(dateParts[1], 10) - 1; // JS months are 0-indexed
                const day = parseInt(dateParts[2], 10);
                
                const nextDateObj = new Date(year, month + 9, day);
                nextDueDateStr = nextDateObj.toISOString().split('T')[0];
            }
        }

        let html = `
            <div class="print-header">
                <h1>Service Issue Summary: ${currentSiteName}</h1>
                <p><strong>Service Date:</strong> ${activeServiceDate}</p>
                <p><strong>Next Service Due:</strong> ${nextDueDateStr}</p>
                <p><strong>Representative:</strong> ${currentRepresentative}</p>
                <p><strong>General Site Notes:</strong><br> ${generalNotes.replace(/\n/g, '<br>')}</p>
            </div>
            <h2>Pack Issues Addressed:</h2>
        `;

        let hasIssues = false;

        for (let i = 1; i <= totalpacks; i++) {
            if (packDataCache[i]) {
                const parts = packDataCache[i];
                const issues = Object.keys(parts).filter(p => parts[p].status === 'Issue');
                
                if (issues.length > 0) {
                    hasIssues = true;
                    html += `<div class="print-pack-block">`;
                    html += `<div class="print-pack-title">Pack ${i}</div>`;
                    html += `<ul class="print-issue-list">`;
                    issues.forEach(part => {
                        const noteText = parts[part].notes ? ` - <em>${parts[part].notes}</em>` : "";
                        html += `<li><strong>${part}:</strong> ${noteText}</li>`;
                    });
                    html += `</ul></div>`;
                }
            }
        }

        if (!hasIssues) {
            html += `<p style="color: green; font-weight: bold;">No pack issues recorded for this site. All Good!</p>`;
        }

        printArea.innerHTML = html;
        window.print();
    });

    // --- 6. SIDEBAR GRID OVERLAY LOGIC ---
    async function buildGridTable(site, containerElement) {
        containerElement.innerHTML = '<p style="text-align: center;">Fetching Live Data...</p>';
        try {
            const q = query(collection(db, "services"), where("site", "==", site));
            const querySnapshot = await getDocs(q);
            
            const serviceMap = {};
            querySnapshot.forEach(doc => {
                const data = doc.data();
                if (doc.id.includes(activeServiceDate)) {
                    if (!serviceMap[data.packId] || (data.lastUpdated > serviceMap[data.packId].lastUpdated)) {
                        serviceMap[data.packId] = data;
                    }
                }
            });

            const total = sitesData[site].count;
            let tableHTML = `<table><thead><tr><th>Pack #</th><th>Right Shoulder</th><th>Left Shoulder</th><th>Front</th><th>Back</th><th>Gun</th><th>Issues & Notes</th></tr></thead><tbody>`;

            for (let i = 1; i <= total; i++) {
                let recordData = null;
                if (site === currentSiteName && packDataCache[i] && Object.keys(packDataCache[i]).some(p => packDataCache[i][p].status !== null)) {
                    recordData = packDataCache[i];
                } else if (serviceMap[`pack ${i}`]) {
                    recordData = serviceMap[`pack ${i}`].serviceDetails;
                }

                if (recordData) {
                    let allNotes = [];
                    const getIcon = (partName) => {
                        const status = recordData[partName]?.status;
                        if (status === 'Good') return '<span class="tick">✔</span>';
                        if (status === 'Issue') {
                            if (recordData[partName].notes) allNotes.push(`<strong>${partName}:</strong> ${recordData[partName].notes}`);
                            return '<span class="cross">✘</span>';
                        }
                        return '<span class="pending">-</span>';
                    };

                    tableHTML += `<tr><td><strong>${i}</strong></td><td>${getIcon("Right Shoulder")}</td><td>${getIcon("Left Shoulder")}</td><td>${getIcon("Front")}</td><td>${getIcon("Back")}</td><td>${getIcon("Gun")}</td><td class="notes-cell">${allNotes.join('<br>') || '<span style="color:#28a745;">None</span>'}</td></tr>`;
                } else {
                    tableHTML += `<tr><td><strong>${i}</strong></td><td colspan="6" class="pending">Not Serviced Yet</td></tr>`;
                }
            }
            tableHTML += `</tbody></table>`;
            containerElement.innerHTML = tableHTML;
        } catch (error) {
            containerElement.innerHTML = '<p style="color: red;">Error loading report.</p>';
        }
    }

    document.getElementById('viewOverlayGridBtn').addEventListener('click', async () => {
        gridModal.style.display = "block";
        await buildGridTable(currentSiteName, document.getElementById('modalTableContainer'));
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => gridModal.style.display = "none");
    window.onclick = function(event) { if (event.target == gridModal) gridModal.style.display = "none"; }

    // --- 7. CHECKLIST SERVICE SESSION & AUTO-SAVE ---
    async function triggerBackgroundSave() {
        if (!isDirty) return; 
        const packToSave = currentpackIndex; 
        const dataToSave = packDataCache[packToSave];
        isDirty = false; 
        document.getElementById('saveIndicator').innerText = "Saving...";
        document.getElementById('saveIndicator').style.color = "#ffc107"; 

        try {
            const safeSiteName = currentSiteName.replace(/\s+/g, '-');
            const docId = `${safeSiteName}-${activeServiceDate}-pack-${packToSave}`;
            
            // Re-calculate Next Due Date to explicitly save it in the database
            let nextDueDateStr = "";
            if (activeServiceDate) {
                const dateParts = activeServiceDate.split('-');
                if (dateParts.length === 3) {
                    const year = parseInt(dateParts[0], 10);
                    const month = parseInt(dateParts[1], 10) - 1; 
                    const day = parseInt(dateParts[2], 10);
                    const nextDateObj = new Date(year, month + 9, day);
                    nextDueDateStr = nextDateObj.toISOString().split('T')[0];
                }
            }

            await setDoc(doc(db, "services", docId), {
                site: currentSiteName,
                packId: `pack ${packToSave}`,
                representative: currentRepresentative,
                serviceDate: activeServiceDate,
                nextServiceDue: nextDueDateStr, // Now saved securely in the cloud!
                serviceDetails: dataToSave,
                lastUpdated: serverTimestamp()
            });

            document.getElementById('saveIndicator').innerText = "Cloud Synced ✓";
            document.getElementById('saveIndicator').style.color = "var(--success)";
        } catch (error) {
            document.getElementById('saveIndicator').innerText = "Sync Failed ✗";
            document.getElementById('saveIndicator').style.color = "var(--danger)";
            isDirty = true; 
        }
    }

    document.getElementById('prevBtn').addEventListener('click', async () => {
        await triggerBackgroundSave();
        if (currentpackIndex > 1) { currentpackIndex--; renderpackUI(); }
    });

    document.getElementById('nextBtn').addEventListener('click', async () => {
        await triggerBackgroundSave();
        if (currentpackIndex < totalpacks) {
            currentpackIndex++; renderpackUI();
        } else {
            alert("You have reached the end of the packs for this site.");
        }
    });

    document.getElementById('packAllOkBtn').addEventListener('click', () => {
        let changed = false;
        partsList.forEach(part => {
            if (packDataCache[currentpackIndex][part].status !== 'Issue') {
                packDataCache[currentpackIndex][part].status = 'Good';
                changed = true;
            }
        });

        if (changed) {
            isDirty = true;
            document.getElementById('saveIndicator').innerText = "Unsaved Changes...";
            document.getElementById('saveIndicator').style.color = "#aaa";
            renderpackUI(); 
        }
    });

    function renderpackUI() {
        document.getElementById('packCounter').innerText = `Pack ${currentpackIndex} of ${totalpacks}`;
        document.getElementById('prevBtn').disabled = currentpackIndex === 1;
        document.getElementById('nextBtn').innerText = currentpackIndex === totalpacks ? "Finish" : "Next \u00BB";
        document.getElementById('saveIndicator').innerText = "Cloud Synced ✓";
        document.getElementById('saveIndicator').style.color = "#aaa";

        if (!packDataCache[currentpackIndex]) {
            packDataCache[currentpackIndex] = {};
            partsList.forEach(part => { packDataCache[currentpackIndex][part] = { status: null, notes: "" }; });
        }

        const currentData = packDataCache[currentpackIndex];
        const container = document.getElementById('partsContainer');
        container.innerHTML = '';

        partsList.forEach(part => {
            const partId = part.replace(/\s+/g, '-').toLowerCase();
            const partData = currentData[part];
            
            const partDiv = document.createElement('div');
            partDiv.className = 'part-section';
            partDiv.innerHTML = `
                <div class="part-header">${part}</div>
                <div class="button-group">
                    <button class="btn-good ${partData.status === 'Good' ? 'active' : ''}" data-part="${part}">All Good</button>
                    <button class="btn-issue ${partData.status === 'Issue' ? 'active' : ''}" data-part="${part}">Issue</button>
                </div>
                <div class="notes-area ${partData.status === 'Issue' ? 'visible' : ''}" id="notes-${partId}">
                    <label>What is wrong & what was fixed?</label>
                    <textarea data-part="${part}" placeholder="Enter details here...">${partData.notes}</textarea>
                </div>
            `;
            container.appendChild(partDiv);
        });

        attachInteractionListeners();
    }

    function attachInteractionListeners() {
        const buttons = document.getElementById('partsContainer').querySelectorAll('button');
        const textareas = document.getElementById('partsContainer').querySelectorAll('textarea');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                isDirty = true;
                document.getElementById('saveIndicator').innerText = "Unsaved Changes...";
                document.getElementById('saveIndicator').style.color = "#aaa";

                const part = e.target.getAttribute('data-part');
                const isGoodBtn = e.target.classList.contains('btn-good');
                const partId = part.replace(/\s+/g, '-').toLowerCase();
                const notesArea = document.getElementById(`notes-${partId}`);
                const siblings = e.target.parentElement.querySelectorAll('button');

                siblings.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                if (isGoodBtn) {
                    notesArea.classList.remove('visible');
                    packDataCache[currentpackIndex][part].status = "Good";
                    packDataCache[currentpackIndex][part].notes = "";
                    notesArea.querySelector('textarea').value = "";
                } else {
                    notesArea.classList.add('visible');
                    packDataCache[currentpackIndex][part].status = "Issue";
                }
            });
        });

        textareas.forEach(ta => {
            ta.addEventListener('input', (e) => {
                isDirty = true;
                document.getElementById('saveIndicator').innerText = "Unsaved Changes...";
                document.getElementById('saveIndicator').style.color = "#aaa";
                
                const part = e.target.getAttribute('data-part');
                packDataCache[currentpackIndex][part].notes = e.target.value;
            });
        });
    }

    // Init App
    loadSites();
</script>

</body>
</html>
