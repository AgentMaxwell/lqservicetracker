<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gear Service Tracker</title>
    <style>
        /* Tablet-Optimized CSS */
        :root {
            --primary: #005A9C;
            --success: #28a745;
            --danger: #dc3545;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: var(--primary); }
        
        /* Form Elements */
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 1.2rem;}
        select, button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem; /* Large text for tablets */
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        
        /* Gear Parts Checklist */
        .part-section {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .part-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .btn-good, .btn-issue {
            flex: 1;
            padding: 15px;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-good { background-color: #6c757d; }
        .btn-good.active { background-color: var(--success); }
        .btn-issue { background-color: #6c757d; }
        .btn-issue.active { background-color: var(--danger); }
        
        /* Notes Area */
        .notes-area {
            display: none; /* Hidden by default */
            margin-top: 15px;
        }
        .notes-area.visible { display: block; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: vertical;
            box-sizing: border-box;
        }
        
        /* Submit Button */
        .submit-btn {
            background-color: var(--primary);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            margin-top: 20px;
            cursor: pointer;
        }
        .submit-btn:active { background-color: #004080; }
        
        #status-msg { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gear Service Tracker</h1>

    <label for="siteSelect">Select Site:</label>
    <select id="siteSelect">
        <option value="">-- Choose Site --</option>
        <option value="Site Alpha">Site Alpha (10 Gears)</option>
        <option value="Site Bravo">Site Bravo (15 Gears)</option>
        <option value="Site Charlie">Site Charlie (5 Gears)</option>
    </select>

    <label for="gearSelect">Select Gear ID:</label>
    <select id="gearSelect" disabled>
        <option value="">-- Choose Site First --</option>
    </select>

    <div id="serviceForm" style="display: none;">
        <h3>Service Checklist</h3>
        
        <div id="partsContainer"></div>

        <button class="submit-btn" id="submitService">Submit Service Record</button>
        <div id="status-msg"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔴 REPLACE THIS with your Firebase Config from Step 1
  const firebaseConfig = {
    apiKey: "AIzaSyDvtVFsGd37aAWNoLSgAQWxhVa7-gNc1Y8",
    authDomain: "lqservicetracker.firebaseapp.com",
    databaseURL: "https://lqservicetracker-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lqservicetracker",
    storageBucket: "lqservicetracker.firebasestorage.app",
    messagingSenderId: "716349093814",
    appId: "1:716349093814:web:f01b3f17da7c8d0a2f7317",
    measurementId: "G-DZNMPDJ91K"
  };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Gear Configuration
    const siteConfig = {
        "Site Alpha": 10,
        "Site Bravo": 15,
        "Site Charlie": 5
    };
    const partsList = ["Right Shoulder", "Left Shoulder", "Front", "Back", "Gun"];
    let currentServiceData = {};

    // DOM Elements
    const siteSelect = document.getElementById('siteSelect');
    const gearSelect = document.getElementById('gearSelect');
    const serviceForm = document.getElementById('serviceForm');
    const partsContainer = document.getElementById('partsContainer');
    const submitBtn = document.getElementById('submitService');
    const statusMsg = document.getElementById('status-msg');

    // Handle Site Selection
    siteSelect.addEventListener('change', (e) => {
        const site = e.target.value;
        gearSelect.innerHTML = '<option value="">-- Choose Gear --</option>';
        if (site) {
            gearSelect.disabled = false;
            const gearCount = siteConfig[site];
            for (let i = 1; i <= gearCount; i++) {
                gearSelect.innerHTML += `<option value="Gear ${i}">Gear #${i}</option>`;
            }
        } else {
            gearSelect.disabled = true;
            serviceForm.style.display = 'none';
        }
    });

    // Handle Gear Selection
    gearSelect.addEventListener('change', (e) => {
        if (e.target.value) {
            serviceForm.style.display = 'block';
            renderParts();
        } else {
            serviceForm.style.display = 'none';
        }
    });

    // Render the Parts Checklist
    function renderParts() {
        partsContainer.innerHTML = '';
        currentServiceData = {}; // Reset data

        partsList.forEach(part => {
            currentServiceData[part] = { status: null, notes: "" }; // Default state
            
            // Clean ID for HTML attributes
            const partId = part.replace(/\s+/g, '-').toLowerCase(); 
            
            const partDiv = document.createElement('div');
            partDiv.className = 'part-section';
            partDiv.innerHTML = `
                <div class="part-header">
                    <span>${part}</span>
                </div>
                <div class="button-group">
                    <button class="btn-good" data-part="${part}">All Good</button>
                    <button class="btn-issue" data-part="${part}">Needs Fix</button>
                </div>
                <div class="notes-area" id="notes-${partId}">
                    <label>What is wrong & what was fixed?</label>
                    <textarea data-part="${part}" placeholder="Enter details here..."></textarea>
                </div>
            `;
            partsContainer.appendChild(partDiv);
        });

        attachButtonListeners();
    }

    // Attach logic to the "All Good" and "Needs Fix" buttons
    function attachButtonListeners() {
        const goodBtns = document.querySelectorAll('.btn-good');
        const issueBtns = document.querySelectorAll('.btn-issue');
        const textareas = document.querySelectorAll('textarea');

        goodBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const part = e.target.getAttribute('data-part');
                const partId = part.replace(/\s+/g, '-').toLowerCase();
                
                // UI updates
                e.target.classList.add('active');
                e.target.nextElementSibling.classList.remove('active');
                document.getElementById(`notes-${partId}`).classList.remove('visible');
                
                // Data updates
                currentServiceData[part].status = "Good";
                currentServiceData[part].notes = "";
                document.querySelector(`textarea[data-part="${part}"]`).value = "";
            });
        });

        issueBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const part = e.target.getAttribute('data-part');
                const partId = part.replace(/\s+/g, '-').toLowerCase();
                
                // UI updates
                e.target.classList.add('active');
                e.target.previousElementSibling.classList.remove('active');
                document.getElementById(`notes-${partId}`).classList.add('visible');
                
                // Data updates
                currentServiceData[part].status = "Fixed/Issue";
            });
        });

        textareas.forEach(ta => {
            ta.addEventListener('input', (e) => {
                const part = e.target.getAttribute('data-part');
                currentServiceData[part].notes = e.target.value;
            });
        });
    }

    // Submit to Google Firestore Database
    submitBtn.addEventListener('click', async () => {
        const site = siteSelect.value;
        const gear = gearSelect.value;

        // Validation: Ensure all parts were checked
        const unchecked = Object.values(currentServiceData).some(part => part.status === null);
        if (unchecked) {
            alert("Please mark the status for all gear parts before submitting.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Saving to Cloud...";
        statusMsg.innerText = "";

        try {
            // Write data to the 'services' collection in Firestore
            await addDoc(collection(db, "services"), {
                site: site,
                gearId: gear,
                serviceDetails: currentServiceData,
                timestamp: serverTimestamp()
            });

            statusMsg.style.color = "green";
            statusMsg.innerText = "Service record saved successfully!";
            
            // Reset form
            setTimeout(() => {
                siteSelect.value = "";
                gearSelect.innerHTML = '<option value="">-- Choose Site First --</option>';
                gearSelect.disabled = true;
                serviceForm.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Service Record";
                statusMsg.innerText = "";
            }, 2000);

        } catch (error) {
            console.error("Error adding document: ", error);
            statusMsg.style.color = "red";
            statusMsg.innerText = "Error saving data. Check console.";
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Service Record";
        }
    });
</script>

</body>
</html>
